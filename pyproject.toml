[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --cov=custom_components.salzburg_verkehr --cov-report=term-missing"

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
